name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly against welder main: surface upstream breakage
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same toolchain recipe as welder's own Linux CI (proven for the C#
      # round-trip there): the DEFAULT brew gcc formula — its libstdc++ is
      # linked into the linuxbrew prefix that brew-gcc binaries carry an
      # RPATH to, so the dotnet host's loader resolves the shim's runtime.
      # (The keg-only gcc@16 keeps its libs out of that prefix and the
      # round-trip then fails with a GLIBCXX version gap.) dotnet comes from
      # brew for the same reason welder's CI takes it from brew: one prefix,
      # one loader story.
      - name: Homebrew toolchain (gcc-16, ninja, dotnet)
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update --quiet
          brew install --quiet gcc ninja cmake dotnet
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DWELDER_CSHARP_WERROR=ON

      - name: Build
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          cmake --build build

      - name: Test
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ctest --test-dir build --output-on-failure
